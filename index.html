<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERA ACADEMY | Sovereign System</title>

    <link rel="icon" type="image/png" href="era-favicon.png">

    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&family=Special+Elite&display=swap" rel="stylesheet">

</head>

<body>

<header>

    <img src="era.png"
         alt=""
         style="max-height:60px; margin-bottom:10px"
         onerror="this.style.display='none'">

    <h1>ERA ACADEMY</h1>

</header>

<nav id="main-nav">

    <button class="nav-btn active"
            onclick="app.showTab('tab-dash', this)">
        DASHBOARD
    </button>

    <button class="nav-btn"
            onclick="app.showTab('tab-notif', this)">
        NOTIFICAÇÕES
    </button>

    <button class="nav-btn"
            onclick="app.showTab('tab-news', this)">
        EDITORIAL
    </button>

    <button class="nav-btn"
            onclick="app.showTab('tab-fin', this)">
        FINANCIAMENTO
    </button>

    <button class="nav-btn"
            onclick="app.showTab('tab-transf', this)">
        TRANSFERIR
    </button>

    <button class="nav-btn"
            onclick="app.showTab('tab-mercado', this)">
        MERCADO
    </button>

    <button class="nav-btn hidden"
            id="btn-mercado-ilegal"
            onclick="app.showTab('tab-mercado-ilegal', this)">
        MERCADO ILEGAL
    </button>

    <button class="nav-btn"
            onclick="app.showTab('tab-frat', this)">
        FRATERNIDADES
    </button>

    <button class="nav-btn"
            onclick="app.showTab('tab-rank', this)">
        RANKING
    </button>

    <button class="nav-btn"
            onclick="app.showTab('tab-vagas', this)">
        VAGAS
    </button>

    <button class="nav-btn"
            id="btn-adm"
            style="color:var(--gold); display:none"
            onclick="app.showTab('tab-adm', this)">
        REITORIA
    </button>

</nav>

<div id="auth-screen" class="container">

    <!-- LOGIN -->

    <div class="card"
         id="login-box"
         style="max-width:380px; margin:auto">

        <h2 style="font-family:'Cinzel'">
            Login Acadêmico
        </h2>

        <input type="email"
               id="email"
               placeholder="E-mail / Login">

        <input type="password"
               id="pass"
               placeholder="Senha">

        <button onclick="app.handleLogin()">
            Acessar
        </button>

        <p class="switch-auth"
           onclick="app.toggleAuth()">

            Solicitar Matrícula

        </p>

    </div>

    <!-- REGISTER -->

    <div class="card hidden"
         id="register-box"
         style="max-width:380px; margin:auto">

        <h2 style="font-family:'Cinzel'">
            Nova Matrícula
        </h2>

        <input type="text"
               id="reg-name"
               placeholder="Nome do Personagem">

        <input type="email"
               id="reg-email"
               placeholder="E-mail / Login">

        <input type="password"
               id="reg-pass"
               placeholder="Senha">

        <!-- NOVO -->
        <select id="reg-origem">

            <option value="">
                Categoria Acadêmica
            </option>

            <option value="herdeiro">
                Herdeiro
            </option>

            <option value="bolsista">
                Bolsista
            </option>

        </select>

        <!-- NOVO -->
        <select id="reg-frat">

            <option value="">
                Fraternidade
            </option>

            <option value="montriel">
                Montriel
            </option>

            <option value="veridian">
                Veridian
            </option>

            <option value="novaire">
                Novaire
            </option>

            <option value="echelon">
                Echelon
            </option>

            <option value="velmora">
                Velmora
            </option>

            <option value="aurelis">
                Aurelis
            </option>

        </select>

        <button onclick="app.handleRegister()">
            Matricular
        </button>

        <p class="switch-auth"
           onclick="app.toggleAuth()">

            Voltar

        </p>

    </div>

</div>

<!-- APP -->

<div id="app-screen"
     class="container hidden">

    <!-- DASHBOARD -->

    <div id="tab-dash"
         class="tab-content">

        <!-- MANTER TODO SEU DASHBOARD ORIGINAL -->

    </div>

    <!-- FRATERNIDADES -->

    <div id="tab-frat"
         class="tab-content hidden">

        <div class="card left">

            <h2 class="tab-title">
                FRATERNIDADES
            </h2>

            <div id="frat-list"></div>

        </div>

    </div>

    <!-- RESTO DAS TABS -->

</div>

<!-- MODAIS -->

<div id="profile-modal"
     class="modal">

    <!-- manter modal original -->

</div>

<div id="image-modal"
     class="modal">

    <!-- manter modal original -->

</div>

<!-- IMPORTS -->

<script type="module" src="firebase.js"></script>

<script type="module" src="utils.js"></script>

<script type="module" src="auth.js"></script>

<script type="module" src="ui.js"></script>

<script type="module" src="financeiro.js"></script>

<script type="module" src="mercado.js"></script>

<script type="module" src="fraternidades.js"></script>

<script type="module" src="reitoria.js"></script>

<script type="module" src="app.js"></script>

</body>
</html>
