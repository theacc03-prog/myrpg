<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERA ACADEMY</title>

    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

</head>
<body>

<header>
    <h1>ERA ACADEMY</h1>
</header>

<nav>

    <button onclick="app.showTab('tab-dashboard')">DASHBOARD</button>

    <button onclick="app.showTab('tab-financeiro')">
        FINANCEIRO
    </button>

    <button onclick="app.showTab('tab-fraternidades')">
        FRATERNIDADES
    </button>

    <button onclick="app.showTab('tab-mercado')">
        MERCADO
    </button>

    <button onclick="app.showTab('tab-reitoria')">
        REITORIA
    </button>

</nav>

<div id="auth-screen">

    <div class="card auth-card">

        <h2>Login</h2>

        <input type="email" id="email" placeholder="Email">

        <input type="password" id="password" placeholder="Senha">

        <button onclick="authSystem.login()">
            Entrar
        </button>

        <div class="divider"></div>

        <h2>Inscrição</h2>

        <input type="text" id="reg-name" placeholder="Nome">

        <input type="email" id="reg-email" placeholder="Email">

        <input type="password" id="reg-password" placeholder="Senha">

        <select id="reg-origem">
            <option value="">Categoria</option>
            <option value="herdeiro">Herdeiro</option>
            <option value="bolsista">Bolsista</option>
        </select>

        <select id="reg-frat">

            <option value="">Fraternidade</option>

            <option value="montriel">Montriel</option>
            <option value="veridian">Veridian</option>
            <option value="novaire">Novaire</option>
            <option value="echelon">Echelon</option>
            <option value="velmora">Velmora</option>
            <option value="aurelis">Aurelis</option>

        </select>

        <button onclick="authSystem.register()">
            Registrar
        </button>

    </div>

</div>

<div id="app-screen" class="hidden">

    <section id="tab-dashboard" class="tab-content">

        <div class="card">

            <h2 id="player-name"></h2>

            <div id="player-tags"></div>

            <div class="balance" id="player-balance"></div>

        </div>

    </section>

    <section id="tab-financeiro" class="tab-content hidden">

        <div class="card">

            <h2>Financeiro</h2>

            <div id="finance-data"></div>

        </div>

    </section>

    <section id="tab-fraternidades" class="tab-content hidden">

        <div class="card">

            <h2>Fraternidades</h2>

            <div id="frat-list"></div>

        </div>

    </section>

    <section id="tab-mercado" class="tab-content hidden">

        <div class="card">

            <h2>Mercado</h2>

            <div id="market-list"></div>

        </div>

    </section>

    <section id="tab-reitoria" class="tab-content hidden">

        <div class="card">

            <h2>Reitoria</h2>

            <div id="admin-panel"></div>

        </div>

    </section>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="utils.js"></script>
<script type="module" src="ui.js"></script>
<script type="module" src="financeiro.js"></script>
<script type="module" src="fraternidades.js"></script>
<script type="module" src="mercado.js"></script>
<script type="module" src="reitoria.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
